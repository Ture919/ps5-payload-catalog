name: Update catalog

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - sources.json
      - scripts/update_catalog.py

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild payloads.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_catalog.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- payloads.json; then
            echo "No changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
            git add payloads.json
            git commit -m "Update payloads.json"
            git push
          fi
